name: SensorNest Front-end Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    
    workflow_dispatch:
    
jobs:
    deploy:
        name: Deploy over SSH
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Copy files with SSH
              uses: easingthemes/ssh-deploy@main
              env:
                    SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
                    # -a implies -rlptgoD. Kept compression and omit-dir-times, removed -v
                    # --info=stats prints only a brief summary at the end.
                    ARGS: "-azO --delete --info=stats"
                    SOURCE: "./"
                    REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
                    REMOTE_USER: ${{ secrets.REMOTE_USER }}
                    TARGET: ${{ secrets.TARGET_DIR }}
                    EXCLUDE: "/node_modules/, **.env, .env.local, .gitignore, .git/, .github/, .vscode/"
                    SCRIPT_BEFORE: |
                        echo "===> Starting deployment"
                        sudo systemctl stop nginx
                        echo "Halting Node process..."
                        cd ${{ secrets.TARGET_DIR }}
                        .scripts/halt.sh
                    SCRIPT_AFTER: |
                        whoami
                        cd ${{ secrets.TARGET_DIR }}
                        sudo systemctl start nginx
                        echo "Starting Node process..."
                        .scripts/run.sh
                        echo "===> Finished deployment"